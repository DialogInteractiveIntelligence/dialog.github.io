name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Work out where GitHub Pages will serve this repository:
      #   <owner>/<owner>.github.io  ->  https://<owner>.github.io/          (base "/")
      #   <owner>/<anything-else>    ->  https://<owner>.github.io/<repo>/   (base "/<repo>")
      # Override by setting repository variables SITE_URL and SITE_BASE
      # (Settings → Secrets and variables → Actions → Variables), e.g. for a custom domain.
      - name: Resolve site URL
        id: site
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          if [ "${repo,,}" = "${owner}.github.io" ]; then base="/"; else base="/${repo}"; fi
          echo "url=https://${owner}.github.io" >> "$GITHUB_OUTPUT"
          echo "base=${base}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.site.outputs.url }}
          SITE_BASE: ${{ vars.SITE_BASE || steps.site.outputs.base }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
